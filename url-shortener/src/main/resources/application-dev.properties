server.port=${SERVER_PORT:8080}

spring.application.name=url-shortener

# Database (H2 In-Memory for Dev)
spring.datasource.url=jdbc:h2:mem:url_shortener_db;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER,VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# App Custom Properties
app.base-url=${BASE_URL:http://localhost:8080}
app.jwt.secret=${JWT_SECRET:super-secret-jwt-key-for-url-shortener-service-2026-min-256-bits}
app.jwt.expiration-ms=86400000
app.ip-hash-salt=${IP_HASH_SALT:default-ip-hash-salt-value-for-privacy-protection}
app.click-tracking.queue-capacity=10000
app.click-tracking.batch-size=100
app.click-tracking.flush-interval-ms=2000
app.click-tracking.raw-retention-days=365
app.click-tracking.respect-dnt=true
app.url.domain-blocklist=malicious.com,phishing.net,badsite.org
app.url.scramble-key=987654321

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.metrics.access=read_only

# Logging
logging.level.root=INFO
logging.level.com.example.urlshortener=INFO

# Spring Doc / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

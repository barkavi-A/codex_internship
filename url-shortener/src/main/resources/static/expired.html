<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>410 - Link Expired or Limit Reached</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="app-header">
        <a href="index.html" class="brand">
            <div class="brand-icon">⚡</div>
            <span>Shortener Service</span>
        </a>
    </header>

    <div class="container auth-wrapper">
        <div class="panel auth-card" style="text-align: center;">
            <h1 style="color: var(--accent-rose); font-size: 2.5rem; margin-bottom: 0.5rem;">410</h1>
            <h2 style="margin-bottom: 1rem;">Link No Longer Available</h2>
            <p style="color: var(--text-secondary); margin-bottom: 1.5rem; font-size: 0.95rem;">
                The short link you clicked has expired, reached its maximum allowed click limit, or been deactivated by its creator.
            </p>
            <a href="index.html" class="btn">Return to Homepage</a>
        </div>
    </div>
</body>
</html>

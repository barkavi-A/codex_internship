server.port=0

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER,VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.base-url=http://localhost:8080
app.jwt.secret=super-secret-jwt-key-for-url-shortener-service-2026-min-256-bits
app.jwt.expiration-ms=3600000
app.ip-hash-salt=test-ip-hash-salt
app.click-tracking.queue-capacity=1000
app.click-tracking.batch-size=10
app.click-tracking.flush-interval-ms=500
app.click-tracking.raw-retention-days=30
app.click-tracking.respect-dnt=true
app.url.domain-blocklist=malicious.com,phishing.net,badsite.org
app.url.scramble-key=987654321

logging.level.com.example.urlshortener=DEBUG
